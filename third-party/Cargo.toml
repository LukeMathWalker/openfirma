[workspace]

[package]
name = "openfirma-third-party"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "_placeholder"
path = "_placeholder.rs"

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
cedar-policy = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", default-features = false, features = ["color", "derive", "env", "std", "help", "usage", "error-context", "suggestions", "wrap_help"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
crossterm = "0.28"
ctrlc = "3.5"
dialoguer = "0.11"
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
elliptic-curve = { version = "0.13", features = ["pem"] }
fs-err = "3.3"
governor = "0.10"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
insta = { version = "1", features = ["filters", "json", "redactions"] }
lru = "0.17"
miette = { version = "7", features = ["fancy-no-backtrace"] }
nix = { version = "0.31", features = ["fs", "process", "signal", "socket", "user"] }
notify = "8"
objc2-virtualization = { version = "0.3.2", default-features = false, features = ["VZBootLoader", "VZLinuxBootLoader", "std"] }
owo-colors = { version = "4", features = ["supports-colors"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
pasetors = "0.7"
pretty_assertions = { version = "1", features = ["unstable"] }
proptest = "1"
prost = "0.14"
prost-types = "0.14"
rand = { version = "0.9", default-features = false, features = ["small_rng"] }
ratatui = "0.30"
rcgen = { version = "0.13", features = ["x509-parser"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_yaml = "0.9"
serial_test = "3"
sha2 = "0.11"
strum = "0.28"
tempfile = "3"
textwrap = "0.16"
thiserror = "2"
time = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "time", "net", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
toml_edit = "0.23"
tonic = { version = "0.14", features = ["transport", "tls-connect-info", "tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tui-markdown = { version = "0.3.8", default-features = false }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
wait-timeout = "0.2"
webpki-roots = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
wiremock = "0.6"
x509-parser = "0.16"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
