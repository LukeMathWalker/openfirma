name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Bazel Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install Bazelisk
        shell: bash
        run: |
          npm install -g @bazel/bazelisk@$BAZELISK_VERSION --registry=https://registry.npmjs.org/
          bazel ${BAZEL_STARTUP_FLAGS:-} version
      - name: Configure BuildBuddy
        env:
          BUILD_BUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
        run: ./scripts/ci/configure-buildbuddy.sh
        shell: bash
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install audit tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v just || cargo-binstall -y --force --locked just@$JUST_VERSION
          command -v cargo-audit || cargo-binstall -y --force --locked cargo-audit@$CARGO_AUDIT_VERSION
        shell: bash

      - name: Run Bazel audit
        run: just bazel-audit

  zizmor:
    name: Actions Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pipx install zizmor==1.25.2
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows/

  deny:
    name: Bazel Licenses & Bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install Bazelisk
        shell: bash
        run: |
          npm install -g @bazel/bazelisk@$BAZELISK_VERSION --registry=https://registry.npmjs.org/
          bazel ${BAZEL_STARTUP_FLAGS:-} version
      - name: Configure BuildBuddy
        env:
          BUILD_BUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
        run: ./scripts/ci/configure-buildbuddy.sh
        shell: bash
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install deny tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v just || cargo-binstall -y --force --locked just@$JUST_VERSION
          command -v cargo-deny || cargo-binstall -y --force --locked cargo-deny@$CARGO_DENY_VERSION
        shell: bash

      - name: Run Bazel deny
        run: just bazel-deny

  lockfiles:
    name: Bazel Lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install Bazelisk
        shell: bash
        run: |
          npm install -g @bazel/bazelisk@$BAZELISK_VERSION --registry=https://registry.npmjs.org/
          bazel ${BAZEL_STARTUP_FLAGS:-} version
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: command -v just || cargo-binstall -y --force --locked just@$JUST_VERSION
        shell: bash

      - name: Check Bazel lockfiles
        run: just bazel-lockfile-check

  trufflehog:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --results=verified,unverified,unknown

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # dprint formats TOML + Markdown + Rust via its exec plugin, which shells
      # out to rustfmt, so the toolchain must be present. setup-rust-toolchain
      # installs it from rust-toolchain.toml (including the rustfmt component).
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""
      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3
        with:
          dprint-version: ${{ env.DPRINT_VERSION }}

  check:
    name: Bazel Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Shorten Bazel output root on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'BAZEL_STARTUP_FLAGS=--output_user_root=D:/bzl\n' >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install Bazelisk
        shell: bash
        run: |
          npm install -g @bazel/bazelisk@$BAZELISK_VERSION --registry=https://registry.npmjs.org/
          bazel ${BAZEL_STARTUP_FLAGS:-} version
      - name: Configure BuildBuddy
        env:
          BUILD_BUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
        run: ./scripts/ci/configure-buildbuddy.sh
        shell: bash

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Bazel check tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: command -v just || cargo-binstall -y --force --locked just@$JUST_VERSION
        shell: bash

      - name: Bazel Build
        id: bazel_build
        continue-on-error: true
        run: just bazel-build
      - name: Bazel Clippy
        id: bazel_clippy
        continue-on-error: true
        run: just bazel-lint
      - name: Bazel Tests
        id: bazel_test
        continue-on-error: true
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Windows' ]]; then
            # rules_rs Windows/Bzlmod doctest runners cannot locate
            # process_wrapper.exe through runfiles. Keep Windows Bazel unit and
            # integration coverage, but leave Bazel doctests to Unix runners.
            bazel ${BAZEL_STARTUP_FLAGS:-} query ${BAZEL_FLAGS:-} 'tests(//...) except kind("rust_doc_test rule", //...)' |
              xargs bazel ${BAZEL_STARTUP_FLAGS:-} test ${BAZEL_FLAGS:-} --test_output=errors
          else
            BAZEL_FLAGS="${BAZEL_FLAGS:-} --test_output=errors" just bazel-test
          fi

      - name: Fail if any Bazel verification step failed
        if: ${{ steps.bazel_build.outcome == 'failure' || steps.bazel_clippy.outcome == 'failure' || steps.bazel_test.outcome == 'failure' }}
        shell: bash
        env:
          BAZEL_BUILD_OUTCOME: ${{ steps.bazel_build.outcome }}
          BAZEL_CLIPPY_OUTCOME: ${{ steps.bazel_clippy.outcome }}
          BAZEL_TEST_OUTCOME: ${{ steps.bazel_test.outcome }}
        run: |
          has_failures=false

          if [[ "$BAZEL_BUILD_OUTCOME" == 'failure' ]]; then
            printf 'Bazel build failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$BAZEL_CLIPPY_OUTCOME" == 'failure' ]]; then
            printf 'Bazel Clippy failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$BAZEL_TEST_OUTCOME" == 'failure' ]]; then
            printf 'Bazel tests failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$has_failures" == 'true' ]]; then
            exit 1
          fi

  coverage:
    name: Bazel Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install Bazelisk
        shell: bash
        run: |
          npm install -g @bazel/bazelisk@$BAZELISK_VERSION --registry=https://registry.npmjs.org/
          bazel ${BAZEL_STARTUP_FLAGS:-} version
      - name: Configure BuildBuddy
        env:
          BUILD_BUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
        run: ./scripts/ci/configure-buildbuddy.sh
        shell: bash

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: command -v just || cargo-binstall -y --force --locked just@$JUST_VERSION
        shell: bash

      - name: Generate Bazel coverage
        run: just bazel-coverage

      - name: Upload Bazel coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: bazel-coverage.lcov
          disable_search: true
          fail_ci_if_error: true
