name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUILD_BUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          buck2: "false"
          supply-chain-tools: "true"
      - run: just audit

  zizmor:
    name: Actions Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pipx install zizmor==1.25.2
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows/

  deny:
    name: Licenses & Bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          buck2: "false"
          supply-chain-tools: "true"
      - run: just deny

  trufflehog:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --results=verified,unverified,unknown

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          buck2: "false"
          dprint: "true"
      - run: just fmt

  reindeer:
    name: Reindeer Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          buck2: "false"
          reindeer: "true"
      - run: just reindeer-check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          buck2: "false"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Enable corepack
        run: corepack enable
      - name: Install cargo-doc-md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: command -v cargo-doc-md || cargo binstall -y --force --locked cargo-doc-md@$CARGO_DOC_MD_VERSION
      - name: Build docs
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: just docs-build

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows Buck2 diagnostics
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rustc -vV
          bash scripts/buck-target-platform.sh
          printf 'BUCK2_BIN=%s\n' "${BUCK2_BIN:-}"
          printf 'BUCK2_ARG0=%s\n' "${BUCK2_ARG0:-}"
          printf 'MSYS2_ARG_CONV_EXCL=%s\n' "${MSYS2_ARG_CONV_EXCL:-}"
          type -a "$BUCK2_BIN"
          file "$BUCK2_BIN" || true
          file "$BUCK2_ARG0" || true
          "$BUCK2_BIN" --version
          printf 'buck2 --version status=%s\n' "$?"
          "$BUCK2_BIN" root
          printf 'buck2 root status=%s\n' "$?"
          "$BUCK2_BIN" uquery 'kind("rust_(binary|library|proc_macro)", //crates/...)'
          printf 'buck2 uquery status=%s\n' "$?"

      - name: Build
        id: build
        continue-on-error: true
        run: just --verbose build

      - name: Buck2 diagnostics after build
        if: always()
        run: bash scripts/ci/buck2-diagnostics.sh build

      - name: Lint
        id: lint
        continue-on-error: true
        run: just lint

      - name: Buck2 diagnostics after lint
        if: always()
        run: bash scripts/ci/buck2-diagnostics.sh lint

      - name: Test
        id: test
        continue-on-error: true
        run: just test

      - name: Buck2 diagnostics after test
        if: always()
        run: bash scripts/ci/buck2-diagnostics.sh test

      - name: Fail if any verification step failed
        if: ${{ steps.build.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.test.outcome == 'failure' }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          has_failures=false

          if [[ "$BUILD_OUTCOME" == 'failure' ]]; then
            printf 'Buck build failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$LINT_OUTCOME" == 'failure' ]]; then
            printf 'Buck Clippy failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$TEST_OUTCOME" == 'failure' ]]; then
            printf 'Buck tests failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$has_failures" == 'true' ]]; then
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure LLVM coverage tools
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_tools="$(rustc --print sysroot)/lib/rustlib/$host/bin"
          printf 'LLVM_PROFDATA=%s/llvm-profdata\n' "$llvm_tools" >> "$GITHUB_ENV"
          printf 'LLVM_COV=%s/llvm-cov\n' "$llvm_tools" >> "$GITHUB_ENV"

      - name: Generate coverage
        run: just coverage

      - name: Buck2 diagnostics after coverage
        if: always()
        run: bash scripts/ci/buck2-diagnostics.sh coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: target/buck-coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  fuzz-check:
    name: Fuzz targets (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buck-just
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check fuzz targets
        run: just fuzz-check

      - name: Buck2 diagnostics after fuzz-check
        if: always()
        run: bash scripts/ci/buck2-diagnostics.sh fuzz-check
