name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            bazel_config: release-linux-x86_64-musl
            archive_target: firma_unix_archive
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            bazel_config: release-linux-aarch64-musl
            archive_target: firma_unix_archive
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            bazel_config: release-darwin-x86_64
            archive_target: firma_unix_archive
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            bazel_config: release-darwin-aarch64
            archive_target: firma_unix_archive
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            bazel_config: release-windows-x86_64-msvc
            archive_target: firma_windows_archive
            archive_ext: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-2025
            bazel_config: release-windows-aarch64-msvc
            archive_target: firma_windows_archive
            archive_ext: zip
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dispatch-${GITHUB_RUN_ID}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Shorten Bazel output root on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'BAZEL_STARTUP_FLAGS=--output_user_root=D:/bzl\n' >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install Bazelisk
        shell: bash
        run: |
          npm install -g @bazel/bazelisk@$BAZELISK_VERSION --registry=https://registry.npmjs.org/
          bazel ${BAZEL_STARTUP_FLAGS:-} version

      - name: Build release artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bazel ${BAZEL_STARTUP_FLAGS:-} build --config=${{ matrix.bazel_config }} //release:${{ matrix.archive_target }}

          mkdir -p dist
          archive=$(bazel ${BAZEL_STARTUP_FLAGS:-} cquery --config=${{ matrix.bazel_config }} --output=files //release:${{ matrix.archive_target }})
          if [[ "$(printf '%s\n' "$archive" | wc -l | tr -d ' ')" != "1" ]]; then
            printf 'expected exactly one Bazel archive output, got:\n%s\n' "$archive" >&2
            exit 1
          fi
          execroot=$(bazel ${BAZEL_STARTUP_FLAGS:-} info execution_root)
          if [[ "$archive" != /* && ! "$archive" =~ ^[A-Za-z]: ]]; then
            archive="$execroot/$archive"
          fi
          name="firma-${VERSION}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          cp "$archive" "dist/$name"
          if command -v python3 >/dev/null 2>&1; then
            python_bin=python3
          else
            python_bin=python
          fi
          "$python_bin" - "dist/$name" > "dist/$name.sha256" <<'PY'
          import hashlib
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"{digest}  {path.name}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firma-${{ matrix.target }}
          path: dist/firma-*
          if-no-files-found: error

  changelog:
    name: Generate changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create release
        # Multi-file glob upload, checksums, and prerelease handling in one
        # place; a hand-rolled `gh release` script would duplicate that.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: dist/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/firma-*.tar.gz
            dist/firma-*.zip
            dist/firma-*.sha256

  bump-tap:
    name: Bump Homebrew tap
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Bump tap formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured; skipping tap bump"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Firma-AI/homebrew-openfirma.git" tap
          chmod +x ./scripts/update-homebrew-tap.sh
          ./scripts/update-homebrew-tap.sh "$VERSION" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/firma.rb
          if git diff --cached --quiet; then
            echo "tap formula already up to date"
            exit 0
          fi
          git commit -m "brew: bump firma to v${VERSION}"
          git push origin main
