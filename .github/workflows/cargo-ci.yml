name: Cargo CI

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Load tool versions
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' tool-versions.env >> "$GITHUB_ENV"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v cargo-nextest || cargo binstall -y --force --locked cargo-nextest@$CARGO_NEXTEST_VERSION
        shell: bash

      - name: Test
        id: test
        continue-on-error: true
        run: cargo nextest run --workspace --no-fail-fast
      # nextest runs unit + integration tests; it does not run doctests, so
      # those run separately via `cargo test --doc`.
      - name: Doctests
        id: doctest
        continue-on-error: true
        run: cargo test --workspace --doc

      - name: Fail if any verification step failed
        if: ${{ steps.test.outcome == 'failure' || steps.doctest.outcome == 'failure' }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DOCTEST_OUTCOME: ${{ steps.doctest.outcome }}
        run: |
          has_failures=false

          if [[ "$TEST_OUTCOME" == 'failure' ]]; then
            printf 'Test failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$DOCTEST_OUTCOME" == 'failure' ]]; then
            printf 'Doctests failed, check the output of its step to troubleshoot the failure.\n'
            has_failures=true
          fi

          if [[ "$has_failures" == 'true' ]]; then
            exit 1
          fi
